update(dt){if(dlg)return;if(shop){if(Pr.Escape){shop=null;return}const i=[1,2,3,4,5].findIndex(n=>Pr['Digit'+n]);if(i>=0&&i<shop.it.length)buy(shop.it[i]);return}

draw(dt){x.fillStyle='#10141c';x.fillRect(0,0,W,H);x.fillStyle='#161b26';x.fillRect(0,0,W,168);tile('floor',0,236,W,H-236);x.globalCompositeOperation='multiply';x.fillStyle='#46506a';x.fillRect(0,236,W,H-236);x.globalCompositeOperation='source-over';

x.fillStyle='#d8d8a8';for(let i=0;i<W;i+=40)x.fillRect(i+8,215,22,2);for(let i=0;i<6;i++){x.fillStyle='#e8e8f0';x.fillRect(296+i*8,200,5,32)}
x.fillStyle='#0b0d14';x.fillRect(0,236,W,2);
for(const b of BLD){glow(b.x,170,70,b.id=='home'?'rgba(255,170,90,.5)':'rgba(120,180,255,.35)',.35);spr(b.s,b.x,168,0,2);x.fillStyle='rgba(5,8,16,.85)';const tw=b.l.length*8+8;x.fillRect(b.x-tw/2,126,tw,12);T(b.l,b.x,128,'#fff','center')}

x.globalCompositeOperation='multiply';x.fillStyle='rgba(90,100,160,.35)';x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';
if(this.near){const b=this.near;x.fillStyle='#3ddc97';x.fillRect(b.x-7,150+Math.sin(tt*6)*3,14,14);T('E',b.x,153+Math.sin(tt*6)*3,'#021','center')}

if(shop){panel(100,50,440,200);T(shop.n,320,62,'#3ddc97','center',10);let y=92;shop.it.forEach((it,i)=>{const own=G.upg[it.id]||G.fl[it.id];T('['+(i+1)+'] '+it.n,116,y,own?'#6f857e':'#fff');T(own?'OWNED':it.p+' CR',524,y,own?'#6f857e':'#ffd166','right');y+=22});T(note,320,y+6,'#ffe9a8','center');T('[Esc] leave',320,226,'#8fa8a0','center')}}};
function enter(id){const t=(TALK[id]||{})[G.day],k='t_'+id;const open=()=>{shop=SH[id];note=''};if(t&&!G.ds[k]){G.ds[k]=1;talk(t,open)}else open()}
function buy(it){if(it.en){if(!spend(it.p)){note='Not enough CR.';sfx(120,.15);return}G.en=Math.min(100,G.en+it.en);note='Bought: '+it.n+'  (+'+it.en+' energy)';sfx(660,.1,'triangle');return}

T('Day 3 complete · Balance '+G.cr+' CR · Files: '+G.files.length,320,160,'#ffd166','center');T('Somewhere, someone is still waiting for a reply...',320,190,'#8fa8a0','center');
if(((tt*2)|0)%2)T('[Enter] back to title',320,260,'#fff','center');rain(dt,.15);vignette(.7)}};

function boot(){scene=SC.title;scene.enter();let last=performance.now();window.__dc={G,SC,go,get scene(){return scene},get dg(){return dg},get pl(){return pl},get tp(){return tp},get dlg(){return dlg},get shop(){return shop}};
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;prompt='';
if(msg.t>0)msg.t-=dt;if(!nxt||fdir<0){if(dlg)dlgUpdate(dt);else if(fade<.6)scene.update(dt)}
x.setTransform(1,0,0,1,0,0);scene.draw(dt);if(dlg)dlgDraw();
if(scene!=SC.title&&scene!=SC.card&&scene!=SC.summary&&scene!=SC.end)hudBottom();
if(fdir){fade=clamp(fade+fdir*dt*5,0,1);if(fdir>0&&fade>=1){scene=SC[nxt[0]];scene.enter(...nxt[1]);nxt=null;fdir=-1}else if(fdir<0&&fade<=0)fdir=0}
if(fade>0){x.fillStyle='rgba(0,0,0,'+fade+')';x.fillRect(0,0,W,H)}
for(const k in Pr)delete Pr[k];requestAnimationFrame(loop)}requestAnimationFrame(loop)}
